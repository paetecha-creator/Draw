    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('party_theme_v1');
          var root = document.documentElement;
          if (savedTheme === 'light') {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          } else {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          }
          var savedLang = localStorage.getItem('party_lang_v1');
          if (savedLang === 'en' || savedLang === 'th') {
            root.lang = savedLang;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased selection:bg-amber-400 selection:text-zinc-950 min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
